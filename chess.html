<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 国际象棋 · 远程对弈</title>
    <!-- 引入 Chess.js 处理棋规 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js">
    </script>
    <!-- 引入 PeerJS 简化 WebRTC 连接 -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: #16213e;
            border-radius: 28px;
            padding: 30px 35px 35px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 650px;
            width: 100%;
            transition: all 0.2s;
        }
        h2 {
            text-align: center;
            margin: 0 0 12px 0;
            font-weight: 500;
            letter-spacing: 1px;
            color: #e0e0e0;
            font-size: 1.7rem;
        }
        .sub {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-top: -6px;
            margin-bottom: 18px;
        }
        /* 棋盘包装 */
        .board-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }
        #chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 640px;
            border: 4px solid #b58863;
            border-radius: 6px;
            overflow: hidden;
            background: #b58863;
            box-shadow: 0 8px 0 #4a3b2b;
        }
        .square {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            min-width: 0;
            overflow: hidden;
        }
        .square.light {
            background: #f0d9b5;
        }
        .square.dark {
            background: #b58863;
        }
        .square.selected {
            background: #7fc97f !important;
            box-shadow: inset 0 0 0 3px #2a7a2a;
        }
        .square.valid-move {
            background: #b8d9b0 !important;
            box-shadow: inset 0 0 0 3px #4c8b4c;
        }
        /* 状态 & 控制区 */
        .status-area {
            background: #0f3460;
            border-radius: 40px;
            padding: 14px 24px;
            margin: 8px 0 18px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            color: #eee;
            font-weight: 500;
        }
        #status-text {
            font-size: 1rem;
            background: #1a1a40;
            padding: 6px 18px;
            border-radius: 40px;
            color: #c7e9ff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            background: #e94560;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #a0223e;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #a0223e;
        }
        .btn.secondary {
            background: #533483;
            box-shadow: 0 4px 0 #3a1f5e;
        }
        .btn.success {
            background: #1b9e5e;
            box-shadow: 0 4px 0 #0f6b40;
        }
        .peer-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #0f3460;
            border-radius: 40px;
            padding: 14px 20px;
            margin-bottom: 6px;
        }
        .peer-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .peer-row label {
            color: #ccc;
            font-weight: 500;
            min-width: 70px;
        }
        .peer-row input {
            flex: 1;
            min-width: 140px;
            padding: 8px 14px;
            border-radius: 40px;
            border: none;
            background: #1a1a40;
            color: white;
            font-size: 0.9rem;
            outline: 1px solid #3a3a6a;
        }
        .peer-row input:focus {
            outline: 2px solid #e94560;
        }
        .peer-row .btn {
            padding: 8px 20px;
            font-size: 0.8rem;
        }
        .footnote {
            text-align: center;
            color: #777;
            font-size: 0.75rem;
            margin-top: 14px;
            border-top: 1px solid #2a2a4a;
            padding-top: 14px;
        }
        .footnote a {
            color: #8ab4f8;
        }
        /* 移动端适配 */
        @media (max-width: 480px) {
            .game-container {
                padding: 10px 12px;
            }
            .square {
                font-size: 1.5rem;
                overflow: hidden;
                white-space: nowrap;
            }
            .status-area {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .btn-group {
                justify-content: center;
            }
            .peer-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h2>♚ 远程对弈</h2>
        <div class="sub">基于 WebRTC · 自动重连</div>

        <!-- 棋盘 -->
        <div class="board-wrapper">
            <div id="chess-board"></div>
        </div>

        <!-- 状态栏 -->
        <div class="status-area">
            <span id="status-text">⚪ 等待连接...</span>
            <div class="btn-group">
                <button class="btn secondary" id="btn-reset">↻ 新游戏</button>
                <button class="btn" id="btn-flip">🔄 翻转棋盘</button>
            </div>
        </div>

        <!-- Peer 连接控制 -->
        <div class="peer-section">
            <div class="peer-row">
                <label>🔗 我的ID</label>
                <input type="text" id="my-id" readonly>
                <button class="btn success" id="btn-copy">复制</button>
            </div>
            <div class="peer-row">
                <label>📞 对方ID</label>
                <input type="text" id="peer-id" placeholder="输入对方的 ID">
                <button class="btn" id="btn-connect">连接</button>
            </div>
        </div>

        <div class="footnote">
            ⚡ 双方都打开此页面 → 复制自己的ID给对方 → 输入对方ID点击连接
        </div>
    </div>

    <script>
        (function() {
            // ---------- 游戏状态 ----------
            const chess = new Chess();
            let boardElement = document.getElementById('chess-board');
            const statusText = document.getElementById('status-text');

            // UI 状态
            let selectedSquare = null;
            let validMoves = [];
            let boardFlipped = false;
            let myColor = ''; // 'w' 或 'b'，由连接角色决定
            let isMyTurn = false;
            let gameOver = false;

            // PeerJS 相关
            let peer = null;
            let conn = null;
            let myId = '';

            // ---------- 重连相关（新增） ----------
            let reconnectAttempts = 0;
            const MAX_RECONNECT_ATTEMPTS = 5;
            let targetPeerId = ''; // 保存对方 ID，用于重连

            // DOM 元素
            const myIdInput = document.getElementById('my-id');
            const peerIdInput = document.getElementById('peer-id');
            const btnConnect = document.getElementById('btn-connect');
            const btnCopy = document.getElementById('btn-copy');
            const btnReset = document.getElementById('btn-reset');
            const btnFlip = document.getElementById('btn-flip');

            // ---------- 棋盘渲染 ----------
            function renderBoard() {
                const board = chess.board();
                boardElement.innerHTML = '';
                const rows = boardFlipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
                for (let r of rows) {
                    for (let c = 0; c < 8; c++) {
                        const square = document.createElement('div');
                        const col = boardFlipped ? 7 - c : c;
                        const squareName = String.fromCharCode(97 + col) + (8 - r);
                        const isLight = (r + col) % 2 === 0;
                        square.className = `square ${isLight ? 'light' : 'dark'}`;
                        square.dataset.square = squareName;

                        const piece = board[r][col];
                        if (piece) {
                            const symbol = piece.symbol || piece.type;
                            const unicode = {
                                'w': { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙' },
                                'b': { 'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟' }
                            };
                            square.textContent = unicode[piece.color][symbol.toUpperCase()] || '';
                        }

                        if (selectedSquare === squareName) {
                            square.classList.add('selected');
                        }
                        if (validMoves.includes(squareName)) {
                            square.classList.add('valid-move');
                        }

                        square.addEventListener('click', () => onSquareClick(squareName));
                        boardElement.appendChild(square);
                    }
                }
                updateStatus();
            }

            // ---------- 更新状态文字 ----------
            function updateStatus() {
                if (gameOver) {
                    if (chess.in_checkmate()) {
                        const winner = chess.turn() === 'w' ? '黑方' : '白方';
                        statusText.textContent = `🏆 ${winner}胜！ (将杀)`;
                    } else if (chess.in_draw()) {
                        statusText.textContent = '🤝 和棋';
                    } else {
                        statusText.textContent = '⏸️ 游戏结束';
                    }
                    return;
                }

                const turn = chess.turn() === 'w' ? '白方' : '黑方';
                const myTurnHint = (chess.turn() === myColor) ? ' (你的回合)' : ' (对手回合)';
                let status = `⚫ ${turn}走棋${myTurnHint}`;
                if (chess.in_check()) status = '❗ ' + status + ' — 将军！';
                statusText.textContent = status;
                isMyTurn = (chess.turn() === myColor);
            }

            // ---------- 走棋逻辑 ----------
            function onSquareClick(squareName) {
                if (gameOver) return;
                if (!isMyTurn) return;

                if (selectedSquare === squareName) {
                    clearSelection();
                    renderBoard();
                    return;
                }

                if (validMoves.includes(squareName)) {
                    const move = { from: selectedSquare, to: squareName, promotion: 'q' };
                    const result = chess.move(move);
                    if (result) {
                        clearSelection();
                        renderBoard();
                        if (conn && conn.open) {
                            conn.send({
                                type: 'move',
                                from: result.from,
                                to: result.to,
                                promotion: result.promotion || 'q'
                            });
                        }
                        if (chess.game_over()) {
                            gameOver = true;
                            renderBoard();
                        }
                        return;
                    } else {
                        clearSelection();
                        renderBoard();
                        return;
                    }
                }

                const piece = chess.get(squareName);
                if (piece && piece.color === myColor) {
                    selectedSquare = squareName;
                    const moves = chess.moves({ square: squareName, verbose: true });
                    validMoves = moves.map(m => m.to);
                    renderBoard();
                } else {
                    clearSelection();
                    renderBoard();
                }
            }

            function clearSelection() {
                selectedSquare = null;
                validMoves = [];
            }

            // ---------- 重置游戏 ----------
            function resetGame() {
                chess.reset();
                gameOver = false;
                clearSelection();
                renderBoard();
                if (conn && conn.open) {
                    conn.send({ type: 'reset' });
                }
            }

            // ---------- 翻转棋盘 ----------
            function flipBoard() {
                boardFlipped = !boardFlipped;
                renderBoard();
            }

            // ---------- 处理收到的消息 ----------
            function handlePeerMessage(data) {
                if (data.type === 'move') {
                    const move = { from: data.from, to: data.to, promotion: data.promotion || 'q' };
                    const result = chess.move(move);
                    if (result) {
                        clearSelection();
                        renderBoard();
                        if (chess.game_over()) {
                            gameOver = true;
                            renderBoard();
                        }
                    } else {
                        console.warn('收到非法走法', data);
                    }
                } else if (data.type === 'reset') {
                    resetGame();
                } else if (data.type === 'role') {
                    // 只有首次连接时处理角色分配（重连时忽略）
                    if (reconnectAttempts === 0) {
                        myColor = data.color;
                        isMyTurn = (chess.turn() === myColor);
                        statusText.textContent = `🎯 你执 ${myColor === 'w' ? '白' : '黑'} 棋`;
                        renderBoard();
                    }
                } else if (data.type === 'sync') {
                    // 收到同步请求，应用 FEN
                    try {
                        chess.load(data.fen);
                        clearSelection();
                        renderBoard();
                        statusText.textContent = '🔄 棋盘已同步';
                        setTimeout(() => updateStatus(), 500);
                    } catch (e) {
                        console.warn('同步 FEN 失败', e);
                    }
                }
                // ping / pong 在 conn.on('data') 中已被过滤，不会到达这里
            }

            // ---------- 生成短 ID ----------
            function generateShortId() {
                return Math.random().toString(36).substring(2, 8).toUpperCase();
            }

            // ---------- 重连函数（新增） ----------
            function reconnectToPeer(peerId) {
                if (!peerId || reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                    statusText.textContent = '❌ 重连失败，请刷新页面手动连接';
                    return;
                }
                reconnectAttempts++;
                statusText.textContent = `🔄 正在重连 (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`;

                // 关闭旧连接（如果有）
                if (conn && conn.open) conn.close();

                // 重新发起连接
                const newConn = peer.connect(peerId, { reliable: true });
                conn = newConn;
                setupConnection();

                // 设置超时重试
                setTimeout(() => {
                    if (!conn || !conn.open) {
                        reconnectToPeer(peerId);
                    }
                }, 3000);
            }

            // ---------- 初始化 PeerJS ----------
            function initPeer() {
                const myShortId = generateShortId();
                peer = new Peer(myShortId, {
                    debug: 0,
                    host: 'peerjs-server-kj4c.onrender.com',
                    port: 443,
                    path: '/',
                    secure: true
                });

                peer.on('open', (id) => {
                    myId = id;
                    myIdInput.value = id;
                    statusText.textContent = '🟢 已上线，你的 ID: ' + id;
                });

                peer.on('connection', (incomingConn) => {
                    // 保存对方 ID 用于重连
                    targetPeerId = incomingConn.peer;
                    conn = incomingConn;
                    // 接收方执白
                    myColor = 'w';
                    isMyTurn = true;
                    setupConnection();

                    // 首次连接（非重连）时发送角色信息
                    if (reconnectAttempts === 0) {
                        // 等待连接打开再发送
                        const sendRole = () => {
                            if (conn && conn.open) {
                                conn.send({ type: 'role', color: 'b' });
                            }
                        };
                        if (conn.open) {
                            sendRole();
                        } else {
                            conn.on('open', sendRole);
                        }
                    }

                    statusText.textContent = '🤝 已连接！你执白棋';
                    renderBoard();
                });

                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                    if (err.type === 'peer-unavailable') {
                        statusText.textContent = '❌ 对方ID无效或离线';
                    }
                    if (err.type === 'unavailable-id') {
                        statusText.textContent = '⚠️ 该ID已被占用，请刷新页面重试';
                    }
                });
            }

            // ---------- 设置连接（增强版） ----------
            function setupConnection() {
                if (!conn) return;

                // 处理 open 事件：心跳 + 重连同步
                conn.on('open', () => {
                    console.log('✅ 连接已建立');

                    // 如果是重连，发送当前棋盘状态让对方同步
                    if (reconnectAttempts > 0) {
                        const fen = chess.fen();
                        conn.send({ type: 'sync', fen: fen });
                        statusText.textContent = '🔄 已重连，正在同步棋盘...';
                    }
                    reconnectAttempts = 0; // 重置重连计数

                    // 启动心跳（每 10 秒发送 ping）
                    const heartbeat = setInterval(() => {
                        if (conn && conn.open) {
                            conn.send({ type: 'ping' });
                        } else {
                            clearInterval(heartbeat);
                        }
                    }, 10000);
                    // 将 heartbeat 挂到 conn 上以便清理
                    conn._heartbeat = heartbeat;
                });

                // 处理数据消息
                conn.on('data', (data) => {
                    // 忽略 ping / pong
                    if (data.type === 'ping' || data.type === 'pong') return;
                    // 同步消息在 handlePeerMessage 中处理
                    handlePeerMessage(data);
                });

                conn.on('close', () => {
                    statusText.textContent = '🔴 连接已断开';
                    // 清理心跳
                    if (conn && conn._heartbeat) {
                        clearInterval(conn._heartbeat);
                        conn._heartbeat = null;
                    }
                    conn = null;
                });

                conn.on('error', (err) => {
                    console.error('Connection error:', err);
                });
            }

            // ---------- 连接到对方（修改：保存 targetPeerId） ----------
            function connectToPeer(peerId) {
                targetPeerId = peerId; // 保存起来，供重连使用
                if (!peer) {
                    statusText.textContent = '⚠️ 请等待页面初始化';
                    return;
                }
                if (conn && conn.open) {
                    conn.close();
                }
                const newConn = peer.connect(peerId, { reliable: true });
                conn = newConn;
                // 发起方执黑
                myColor = 'b';
                isMyTurn = false;
                setupConnection();

                // 首次连接（非重连）时发送角色信息
                if (reconnectAttempts === 0) {
                    conn.on('open', () => {
                        if (conn && conn.open) {
                            conn.send({ type: 'role', color: 'w' });
                            statusText.textContent = '🤝 已连接！你执黑棋';
                            renderBoard();
                        }
                    });
                } else {
                    // 重连时，连接建立后更新状态
                    conn.on('open', () => {
                        statusText.textContent = '🤝 已重连！';
                        renderBoard();
                    });
                }

                // 连接超时检测
                setTimeout(() => {
                    if (conn && !conn.open) {
                        statusText.textContent = '⏳ 连接超时，请检查ID';
                    }
                }, 5000);
            }

            // ---------- 复制ID ----------
            function copyMyId() {
                const id = myIdInput.value;
                if (id) {
                    navigator.clipboard.writeText(id).then(() => {
                        statusText.textContent = '✅ 已复制ID';
                        setTimeout(() => updateStatus(), 1500);
                    }).catch(() => {
                        myIdInput.select();
                        document.execCommand('copy');
                        statusText.textContent = '✅ 已复制ID';
                        setTimeout(() => updateStatus(), 1500);
                    });
                }
            }

            // ---------- 事件绑定 ----------
            btnConnect.addEventListener('click', () => {
                const id = peerIdInput.value.trim();
                if (!id) {
                    statusText.textContent = '⚠️ 请输入对方ID';
                    return;
                }
                connectToPeer(id);
            });

            btnCopy.addEventListener('click', copyMyId);
            btnReset.addEventListener('click', resetGame);
            btnFlip.addEventListener('click', flipBoard);

            peerIdInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    btnConnect.click();
                }
            });

            // ---------- 页面可见性变化监听（切后台自动重连） ----------
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    // 页面变为可见，检查连接状态
                    if (conn && !conn.open) {
                        console.log('📡 页面可见，但连接已断开，尝试重连...');
                        if (targetPeerId) {
                            reconnectToPeer(targetPeerId);
                        } else {
                            statusText.textContent = '⚠️ 无对方 ID，无法重连';
                        }
                    }
                }
            });

            // ---------- 启动 ----------
            initPeer();
            renderBoard();
            statusText.textContent = '⏳ 初始化...';

            // 清理资源
            window.addEventListener('beforeunload', () => {
                if (conn) {
                    if (conn._heartbeat) clearInterval(conn._heartbeat);
                    conn.close();
                }
                if (peer) peer.destroy();
            });

        })();
    </script>
</body>
</html>
